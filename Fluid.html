<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluid Simulation หลากสีตามเมาส์</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            font-family: 'Kanit', sans-serif, system-ui;
        }
        canvas {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        
        .info-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.7);
            pointer-events: none; 
            user-select: none;
            z-index: 10;
        }
        .info-overlay h1 {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 4px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        .info-overlay p {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>
    <canvas id="fluid"></canvas>
    <script src="https://cdn.jsdelivr.net/npm/webgl-fluid"></script>
    <script>
        const canvas = document.getElementById('fluid');
        
        WebGLFluid(canvas, {
            IMMEDIATE: true,            
            TRIGGER: 'hover',           
            SIM_RESOLUTION: 128,        
            DYE_RESOLUTION: 1024,       
            DENSITY_DISSIPATION: 1.7,   
            VELOCITY_DISSIPATION: 0.3,  
            PRESSURE: 0.8,              
            PRESSURE_ITERATIONS: 20,
            CURL: 30,                   
            SPLAT_RADIUS: 0.25,         
            SPLAT_FORCE: 6000,          
            SHADING: true,              
            COLORFUL: true,             
            COLOR_UPDATE_SPEED: 10,     
            PAUSED: false,
            BACK_COLOR: { r: 0, g: 0, b: 0 }, 
            TRANSPARENT: false,
            BLOOM: true,                
            BLOOM_ITERATIONS: 8,
            BLOOM_RESOLUTION: 256,
            BLOOM_INTENSITY: 0.8,
            BLOOM_THRESHOLD: 0.6,
            SUNRAYS: true,              
            SUNRAYS_WEIGHT: 0.5,
        });
    </script>
</body>
</html>
