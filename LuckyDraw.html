<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Draw</title>
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/8610/8610897.png">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;800;900&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --bg: #08080e;
            --bg-lighter: #0d0d16;
            --surface: rgba(255,255,255,0.03);
            --card: rgba(255,255,255,0.05);
            --border: rgba(240,165,0,0.12);
            --border-subtle: rgba(255,255,255,0.06);
            --accent: #f0a500;
            --accent-light: #ffd466;
            --accent-dim: rgba(240,165,0,0.12);
            --text: #f0ece4;
            --text-muted: #5e5e70;
            --danger: #ff6b6b;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Prompt', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            overflow-y: auto;
            padding: 24px 16px;
        }

        /* === พื้นหลังออร์บ === */
        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(110px);
            pointer-events: none;
            z-index: 0;
            transition: background 1.2s ease, filter 1.2s ease;
        }
        .bg-orb-1 { width: 520px; height: 520px; background: rgba(240,165,0,0.06); top: -160px; left: -160px; animation: orb-float 26s ease-in-out infinite; }
        .bg-orb-2 { width: 420px; height: 420px; background: rgba(200,100,0,0.04); bottom: -120px; right: -120px; animation: orb-float 21s ease-in-out infinite reverse; }
        .bg-orb-3 { width: 320px; height: 320px; background: rgba(255,200,50,0.035); top: 38%; left: 52%; animation: orb-float 30s ease-in-out infinite 6s; }

        @keyframes orb-float {
            0%, 100% { transform: translate(0,0) scale(1); }
            25% { transform: translate(55px,-35px) scale(1.06); }
            50% { transform: translate(-25px,45px) scale(0.94); }
            75% { transform: translate(35px,18px) scale(1.03); }
        }

        body.state-spinning .bg-orb-1 { background: rgba(240,165,0,0.1); filter: blur(85px); }
        body.state-spinning .bg-orb-2 { background: rgba(200,100,0,0.07); filter: blur(85px); }
        body.state-winner .bg-orb-1 { background: rgba(240,165,0,0.13); }
        body.state-winner .bg-orb-2 { background: rgba(255,100,100,0.08); }
        body.state-winner .bg-orb-3 { background: rgba(255,215,0,0.09); }

        /* === Flash === */
        .flash-overlay {
            position: fixed; inset: 0;
            background: radial-gradient(circle at 50% 32%, rgba(255,215,0,0.45), transparent 65%);
            opacity: 0; pointer-events: none; z-index: 50;
            transition: opacity 0.2s ease-out;
        }
        .flash-overlay.active { opacity: 1; transition: opacity 0.04s; }

        /* === Toast === */
        .toast {
            position: fixed; top: 28px; left: 50%;
            transform: translateX(-50%) translateY(-120px);
            background: rgba(255,100,100,0.92);
            backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
            color: #fff; padding: 14px 32px; border-radius: 14px;
            font-weight: 600; font-size: 0.92rem; z-index: 200;
            transition: transform 0.5s cubic-bezier(0.175,0.885,0.32,1.275);
            pointer-events: none; box-shadow: 0 8px 32px rgba(0,0,0,0.35);
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.success { background: rgba(78,205,196,0.92); }

        /* === App Container === */
        .app {
            position: relative; z-index: 10;
            width: 100%; max-width: 520px;
            display: flex; flex-direction: column; align-items: center; gap: 18px;
        }
        .app.shake { animation: shake 0.35s ease-out; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            15% { transform: translateX(-4px) translateY(1px); }
            35% { transform: translateX(4px) translateY(-1px); }
            55% { transform: translateX(-2px); }
            75% { transform: translateX(2px); }
        }

        /* === Header === */
        .app-header { width: 100%; display: flex; justify-content: space-between; align-items: center; }
        .logo { display: flex; align-items: center; gap: 12px; }
        .logo-icon {
            width: 44px; height: 44px;
            background: linear-gradient(135deg, var(--accent), #c77d00);
            border-radius: 13px; display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem; color: #1a1000;
            box-shadow: 0 4px 18px rgba(240,165,0,0.28);
        }
        .logo h1 {
            font-family: 'Kanit', sans-serif;
            font-size: 1.55rem; font-weight: 900; letter-spacing: 0.5px;
        }

        .icon-btn {
            width: 44px; height: 44px;
            border: 1px solid var(--border-subtle); border-radius: 13px;
            background: var(--surface); color: var(--text-muted);
            font-size: 1rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
        }
        .icon-btn:hover { background: var(--card); color: var(--text); border-color: var(--border); }
        .icon-btn.muted { color: var(--danger); border-color: rgba(255,107,107,0.2); }

        /* === Display Frame (Rotating Conic Border) === */
        @property --ba {
            syntax: '<angle>';
            initial-value: 0deg;
            inherits: false;
        }

        .display-frame {
            width: 100%; border-radius: 24px; padding: 2px;
            background: conic-gradient(from var(--ba), rgba(240,165,0,0.5), rgba(240,165,0,0.04) 25%, transparent 50%, rgba(240,165,0,0.04) 75%, rgba(240,165,0,0.5));
            animation: border-spin 4s linear infinite;
            box-shadow: 0 0 40px rgba(240,165,0,0.04);
            transition: box-shadow 0.6s ease;
        }
        @keyframes border-spin { to { --ba: 360deg; } }

        .display-frame.spinning {
            box-shadow: 0 0 70px rgba(240,165,0,0.14), 0 0 140px rgba(240,165,0,0.04);
            animation-duration: 1.4s;
        }
        .display-frame.winner {
            box-shadow: 0 0 90px rgba(240,165,0,0.3), 0 0 180px rgba(240,165,0,0.08);
            animation-duration: 2s;
            background: conic-gradient(from var(--ba), #f0a500, #ff6b6b 25%, #ffd466 50%, #ff8e53 75%, #f0a500);
        }

        .display-inner {
            background: var(--bg-lighter);
            border-radius: 22px; padding: 34px 24px; min-height: 210px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            position: relative; overflow: hidden;
        }
        /* สแกนไลน์บางๆ */
        .display-inner::after {
            content: ''; position: absolute; inset: 0;
            background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,0.025) 3px, rgba(0,0,0,0.025) 4px);
            pointer-events: none; border-radius: 22px;
        }

        /* === Reel === */
        .reel-viewport {
            display: flex; flex-direction: column; align-items: center; gap: 0;
            width: 100%; position: relative; z-index: 1;
        }
        .reel-row {
            font-family: 'Kanit', sans-serif; text-align: center;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            max-width: 100%; padding: 0 16px;
        }
        .reel-ghost {
            font-size: 1.25rem; font-weight: 400; color: rgba(240,165,0,0.08);
            height: 30px; line-height: 30px; transition: opacity 0.3s;
        }
        .reel-center {
            font-size: 2.9rem; font-weight: 900; color: var(--text);
            height: 68px; line-height: 68px;
            text-shadow: 0 0 18px rgba(240,165,0,0.12);
            transition: color 0.3s, text-shadow 0.3s;
        }
        .reel-center.slide-in { animation: reel-drop 0.13s ease-out; }
        @keyframes reel-drop {
            from { transform: translateY(-28px); opacity: 0.2; }
            to { transform: translateY(0); opacity: 1; }
        }
        .reel-center.winner-reveal {
            color: var(--accent-light);
            text-shadow: 0 0 35px rgba(240,165,0,0.5), 0 0 70px rgba(240,165,0,0.18);
            animation: win-pop 0.55s cubic-bezier(0.175,0.885,0.32,1.275) infinite alternate;
        }
        @keyframes win-pop { from { transform: scale(1); } to { transform: scale(1.07); } }

        .display-label {
            font-size: 0.88rem; color: var(--text-muted);
            margin-bottom: 8px; position: relative; z-index: 1;
            animation: breathe 3s ease-in-out infinite;
            transition: opacity 0.35s, transform 0.35s;
        }
        .display-label.hidden { opacity: 0; transform: translateY(-10px); pointer-events: none; }
        @keyframes breathe { 0%, 100% { opacity: 0.35; } 50% { opacity: 0.75; } }

        /* === Info Bar === */
        .info-bar {
            display: flex; align-items: center; gap: 22px;
            background: var(--surface); border: 1px solid var(--border-subtle);
            border-radius: 16px; padding: 12px 30px;
        }
        .info-item { display: flex; align-items: baseline; gap: 6px; }
        .info-label { font-size: 0.78rem; color: var(--text-muted); font-weight: 500; }
        .info-value { font-family: 'Kanit', sans-serif; font-size: 1.4rem; font-weight: 800; color: var(--accent-light); }
        .info-unit { font-size: 0.78rem; color: var(--text-muted); }
        .info-divider { width: 1px; height: 24px; background: var(--border-subtle); }

        /* === Draw Button === */
        .draw-btn {
            width: 250px; height: 64px; border: none; border-radius: 32px;
            background: linear-gradient(135deg, #f0a500, #e08900, #c77d00);
            color: #1a1000; font-family: 'Kanit', sans-serif;
            font-size: 1.22rem; font-weight: 800; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            box-shadow: 0 4px 28px rgba(240,165,0,0.3);
            transition: all 0.2s ease;
            animation: btn-glow 2.5s ease-in-out infinite;
            position: relative; overflow: hidden;
        }
        .draw-btn::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.22), transparent);
            animation: shimmer 3.8s ease-in-out infinite;
        }
        .draw-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 40px rgba(240,165,0,0.4); }
        .draw-btn:active { transform: scale(0.95); box-shadow: 0 2px 14px rgba(240,165,0,0.2); }
        .draw-btn:disabled {
            background: linear-gradient(135deg, #2a2a2a, #1e1e1e);
            color: #555; box-shadow: none; animation: none; cursor: not-allowed; transform: none;
        }
        .draw-btn:disabled::before { display: none; }

        @keyframes btn-glow {
            0%, 100% { box-shadow: 0 4px 28px rgba(240,165,0,0.3), 0 0 0 0 rgba(240,165,0,0.2); }
            50% { box-shadow: 0 4px 38px rgba(240,165,0,0.38), 0 0 0 14px rgba(240,165,0,0); }
        }
        @keyframes shimmer { 0%, 55% { left: -100%; } 100% { left: 100%; } }

        /* === Controls === */
        .controls-row { display: flex; gap: 10px; }
        .ctrl-btn {
            padding: 10px 20px; border: 1px solid var(--border-subtle); border-radius: 12px;
            background: var(--surface); color: var(--text-muted);
            font-family: 'Prompt', sans-serif; font-size: 0.82rem; font-weight: 600;
            cursor: pointer; display: flex; align-items: center; gap: 8px;
            transition: all 0.2s;
        }
        .ctrl-btn:hover { background: var(--card); color: var(--text); border-color: var(--border); }
        .ctrl-btn:active { transform: scale(0.96); }
        .ctrl-btn i { font-size: 0.78rem; }

        /* === Name Panel === */
        .name-panel {
            width: 100%; background: var(--surface); border: 1px solid var(--border-subtle);
            border-radius: 16px; padding: 20px;
            max-height: 320px; opacity: 1; overflow: hidden;
            transition: all 0.45s cubic-bezier(0.4,0,0.2,1);
        }
        .name-panel.collapsed { max-height: 0; opacity: 0; padding: 0 20px; border-width: 0; }
        .name-panel label { display: block; font-size: 0.78rem; color: var(--text-muted); margin-bottom: 10px; font-weight: 500; }
        .name-panel textarea {
            width: 100%; height: 130px; background: rgba(0,0,0,0.35);
            border: 1px solid var(--border-subtle); border-radius: 10px;
            color: var(--text); font-family: 'Prompt', sans-serif; font-size: 0.88rem;
            padding: 12px; resize: vertical; outline: none; transition: border-color 0.2s;
            line-height: 1.6;
        }
        .name-panel textarea:focus { border-color: var(--accent); }
        .name-panel textarea::placeholder { color: rgba(255,255,255,0.12); }

        /* === Winners === */
        .winners-section { width: 100%; padding-top: 18px; border-top: 1px solid var(--border-subtle); }
        .winners-title {
            font-family: 'Kanit', sans-serif; font-size: 0.72rem; font-weight: 600;
            color: var(--text-muted); text-transform: uppercase; letter-spacing: 3px; margin-bottom: 14px;
        }
        .winners-grid { display: flex; flex-wrap: wrap; gap: 8px; }
        .winner-badge {
            background: var(--accent-dim); border: 1px solid rgba(240,165,0,0.18);
            color: var(--accent-light); padding: 6px 14px 6px 8px; border-radius: 22px;
            font-family: 'Kanit', sans-serif; font-size: 0.84rem; font-weight: 600;
            display: flex; align-items: center; gap: 8px;
            animation: badge-pop 0.4s cubic-bezier(0.175,0.885,0.32,1.275);
        }
        .badge-num {
            background: rgba(240,165,0,0.22); min-width: 24px; height: 24px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.68rem; font-weight: 800;
        }
        @keyframes badge-pop { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        /* === Confetti Canvas === */
        #confettiCanvas { position: fixed; top: 0; left: 0; pointer-events: none; z-index: 100; }

        /* === Responsive === */
        @media (max-width: 560px) {
            body { padding: 16px 12px; }
            .logo h1 { font-size: 1.3rem; }
            .display-inner { padding: 26px 14px; min-height: 180px; }
            .reel-center { font-size: 2.2rem; height: 54px; line-height: 54px; }
            .reel-ghost { font-size: 1rem; height: 24px; line-height: 24px; }
            .draw-btn { width: 100%; height: 58px; font-size: 1.1rem; border-radius: 29px; }
            .info-bar { padding: 10px 20px; gap: 16px; }
            .info-value { font-size: 1.2rem; }
            .controls-row { width: 100%; }
            .ctrl-btn { flex: 1; justify-content: center; }
        }

        /* === Reduced Motion === */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>

    <!-- พื้นหลังออร์บแสง -->
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
    <div class="bg-orb bg-orb-3"></div>

    <!-- Flash effect -->
    <div class="flash-overlay" id="flashOverlay"></div>

    <!-- Toast notification -->
    <div class="toast" id="toast"></div>

    <!-- Confetti -->
    <canvas id="confettiCanvas"></canvas>

    <!-- เนื้อหาหลัก -->
    <main class="app" id="app">
        <header class="app-header">
            <div class="logo">
                <div class="logo-icon"><i class="fas fa-star"></i></div>
                <h1>Lucky Draw</h1>
            </div>
            <button class="icon-btn" id="soundBtn" onclick="toggleSound()" aria-label="เปิดปิดเสียง">
                <i class="fas fa-volume-high" id="soundIcon"></i>
            </button>
        </header>

        <!-- จอแสดงผลรีล -->
        <section class="display-frame" id="displayFrame">
            <div class="display-inner">
                <div class="display-label" id="displayLabel">กดปุ่มเพื่อจับรางวัล</div>
                <div class="reel-viewport">
                    <div class="reel-row reel-ghost" id="reelPrev"></div>
                    <div class="reel-row reel-center" id="reelCenter">?</div>
                    <div class="reel-row reel-ghost" id="reelNext"></div>
                </div>
            </div>
        </section>

        <!-- แถบข้อมูล -->
        <div class="info-bar">
            <div class="info-item">
                <span class="info-label">คงเหลือ</span>
                <span class="info-value" id="count">10</span>
                <span class="info-unit">คน</span>
            </div>
            <div class="info-divider"></div>
            <div class="info-item">
                <span class="info-label">ออกแล้ว</span>
                <span class="info-value" id="drawnCount">0</span>
                <span class="info-unit">คน</span>
            </div>
        </div>

        <!-- ปุ่มจับรางวัล -->
        <button class="draw-btn" id="drawBtn" onclick="startDraw()">
            <span>จับรางวัล</span>
            <i class="fas fa-trophy"></i>
        </button>

        <!-- ปุ่มควบคุม -->
        <div class="controls-row">
            <button class="ctrl-btn" id="toggleBtn" onclick="toggleInput()">
                <i class="fas fa-eye-slash"></i> ซ่อนรายชื่อ
            </button>
            <button class="ctrl-btn" onclick="resetList()">
                <i class="fas fa-arrow-rotate-left"></i> รีเซ็ต
            </button>
        </div>

        <!-- แพนเนลรายชื่อ -->
        <div class="name-panel" id="namePanel">
            <label for="nameList">รายชื่อผู้เข้าร่วม (แยกบรรทัด)</label>
            <textarea id="nameList" oninput="updateCount()" placeholder="ใส่รายชื่อที่นี่...">สมชาย
สมหญิง
ประวิทย์
สุดา
มานะ
ปิติ
วีระ
ชูใจ
เก่งกาจ
วันเพ็ญ</textarea>
        </div>

        <!-- ผู้โชคดีที่ออกแล้ว -->
        <section class="winners-section" id="winnersSection" style="display:none">
            <div class="winners-title">ผู้โชคดี</div>
            <div class="winners-grid" id="winnersList"></div>
        </section>
    </main>

    <script>
        /* ============================
           DOM References
           ============================ */
        const reelCenter   = document.getElementById('reelCenter');
        const reelPrev     = document.getElementById('reelPrev');
        const reelNext     = document.getElementById('reelNext');
        const displayLabel = document.getElementById('displayLabel');
        const displayFrame = document.getElementById('displayFrame');
        const nameInput    = document.getElementById('nameList');
        const namePanel    = document.getElementById('namePanel');
        const toggleBtn    = document.getElementById('toggleBtn');
        const countSpan    = document.getElementById('count');
        const drawnSpan    = document.getElementById('drawnCount');
        const drawBtn      = document.getElementById('drawBtn');
        const soundBtn     = document.getElementById('soundBtn');
        const soundIcon    = document.getElementById('soundIcon');
        const flashOverlay = document.getElementById('flashOverlay');
        const winnersSec   = document.getElementById('winnersSection');
        const winnersList  = document.getElementById('winnersList');
        const toastEl      = document.getElementById('toast');
        const appEl        = document.getElementById('app');

        /* ============================
           State
           ============================ */
        let isSpinning  = false;
        let namesArray  = [];
        let originalNames = '';
        let isMuted     = false;
        let drawCount   = 0;

        /* ============================
           Audio System (Web Audio API)
           ============================ */
        let audioCtx;
        function ctx() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function tone(freq, type, dur, vol) {
            if (isMuted) return;
            try {
                const c = ctx();
                const o = c.createOscillator();
                const g = c.createGain();
                o.type = type;
                o.frequency.setValueAtTime(freq, c.currentTime);
                g.gain.setValueAtTime(vol || 0.35, c.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + dur);
                o.connect(g); g.connect(c.destination);
                o.start(); o.stop(c.currentTime + dur);
            } catch (e) { /* เงียบถ้าเกิด error */ }
        }

        function sfxLever()  { tone(160, 'sawtooth', 0.07, 0.25); setTimeout(() => tone(110, 'square', 0.12, 0.18), 70); }
        function sfxTick()   { tone(750 + Math.random() * 250, 'square', 0.06, 0.15); }
        function sfxWin() {
            if (isMuted) return;
            try {
                const c = ctx(); const t = c.currentTime;
                [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => {
                    const o = c.createOscillator(); const g = c.createGain();
                    o.type = 'triangle';
                    o.frequency.setValueAtTime(f, t + i * 0.11);
                    g.gain.setValueAtTime(0.55, t + i * 0.11);
                    g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.11 + 0.5);
                    o.connect(g); g.connect(c.destination);
                    o.start(t + i * 0.11); o.stop(t + i * 0.11 + 0.55);
                });
            } catch (e) {}
        }

        /* ============================
           Toast
           ============================ */
        let toastTimer;
        function showToast(msg, type) {
            clearTimeout(toastTimer);
            toastEl.textContent = msg;
            toastEl.className = 'toast ' + (type || 'error');
            requestAnimationFrame(() => toastEl.classList.add('show'));
            toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2800);
        }

        /* ============================
           Init
           ============================ */
        window.addEventListener('load', () => {
            originalNames = nameInput.value;
            updateCount();
        });

        /* ============================
           Helpers
           ============================ */
        function getNames() {
            return nameInput.value.split('\n').map(n => n.trim()).filter(n => n);
        }

        function updateCount() {
            countSpan.textContent = getNames().length;
        }

        function randIdx() {
            return Math.floor(Math.random() * namesArray.length);
        }

        /* อัปเดตรีล 3 แถว (animate = true สำหรับช่วงช้าลง) */
        function setReel(ci, animate) {
            const len = namesArray.length;
            if (!len) return;
            const pi = (ci - 1 + len) % len;
            const ni = (ci + 1) % len;

            reelPrev.textContent = namesArray[pi];
            reelCenter.textContent = namesArray[ci];
            reelNext.textContent = namesArray[ni];

            if (animate) {
                reelCenter.classList.remove('slide-in');
                void reelCenter.offsetWidth;   // force reflow
                reelCenter.classList.add('slide-in');
            }
        }

        /* ============================
           Toggle รายชื่อ
           ============================ */
        function toggleInput() {
            const hide = namePanel.classList.toggle('collapsed');
            toggleBtn.innerHTML = hide
                ? '<i class="fas fa-list-ul"></i> แสดงรายชื่อ'
                : '<i class="fas fa-eye-slash"></i> ซ่อนรายชื่อ';
        }

        /* ============================
           Toggle เสียง
           ============================ */
        function toggleSound() {
            isMuted = !isMuted;
            soundIcon.className = isMuted ? 'fas fa-volume-xmark' : 'fas fa-volume-high';
            soundBtn.classList.toggle('muted', isMuted);
            if (!isMuted) ctx();
        }

        /* ============================
           รีเซ็ต
           ============================ */
        function resetList() {
            if (isSpinning) return;
            nameInput.value = originalNames;
            updateCount();
            drawnSpan.textContent = '0';
            drawCount = 0;
            winnersList.innerHTML = '';
            winnersSec.style.display = 'none';

            reelCenter.textContent = '?';
            reelCenter.className = 'reel-row reel-center';
            reelPrev.textContent = '';
            reelNext.textContent = '';
            displayLabel.classList.remove('hidden');
            displayFrame.className = 'display-frame';
            document.body.className = '';

            if (namePanel.classList.contains('collapsed')) toggleInput();
            showToast('รีเซ็ตรายชื่อเรียบร้อยแล้ว', 'success');
        }

        /* ============================
           จับรางวัล — ลอจิกหลัก
           ============================ */
        function startDraw() {
            if (isSpinning) return;

            namesArray = getNames();
            if (!namesArray.length) {
                showToast('กรุณาใส่รายชื่อก่อน');
                if (namePanel.classList.contains('collapsed')) toggleInput();
                return;
            }

            /* ซ่อนแพนเนล */
            if (!namePanel.classList.contains('collapsed')) toggleInput();

            /* เริ่มสปิน */
            sfxLever();
            isSpinning  = true;
            drawBtn.disabled = true;
            nameInput.disabled = true;
            displayLabel.classList.add('hidden');
            reelCenter.classList.remove('winner-reveal');
            displayFrame.className = 'display-frame spinning';
            document.body.className = 'state-spinning';

            /* Phase 1 — หมุนเร็ว ~2 วินาที */
            const t0 = performance.now();
            const fastMs = 2000;
            let lastTick = 0;

            function fastLoop(now) {
                setReel(randIdx(), false);
                if (now - lastTick > 65) { sfxTick(); lastTick = now; }
                if (now - t0 < fastMs) {
                    requestAnimationFrame(fastLoop);
                } else {
                    slowDown(55);
                }
            }
            requestAnimationFrame(fastLoop);
        }

        /* Phase 2 — ช้าลงทีละนิด */
        function slowDown(delay) {
            setReel(randIdx(), true);
            sfxTick();

            if (delay < 650) {
                setTimeout(() => slowDown(delay * 1.17), delay);
            } else {
                setTimeout(revealWinner, delay);
            }
        }

        /* Phase 3 — เปิดเผยผู้โชคดี */
        function revealWinner() {
            const wi = randIdx();
            const name = namesArray[wi];

            setReel(wi, true);

            /* Flash + Shake */
            flashOverlay.classList.add('active');
            setTimeout(() => flashOverlay.classList.remove('active'), 220);
            appEl.classList.add('shake');
            setTimeout(() => appEl.classList.remove('shake'), 380);

            /* Winner animation */
            reelCenter.classList.remove('slide-in');
            reelCenter.classList.add('winner-reveal');
            displayFrame.className = 'display-frame winner';
            document.body.className = 'state-winner';

            sfxWin();

            /* อัปเดตข้อมูล */
            namesArray.splice(wi, 1);
            nameInput.value = namesArray.join('\n');
            updateCount();
            drawCount++;
            drawnSpan.textContent = drawCount;

            /* เพิ่ม badge ผู้โชคดี */
            winnersSec.style.display = 'block';
            const badge = document.createElement('div');
            badge.className = 'winner-badge';
            badge.innerHTML = '<span class="badge-num">' + drawCount + '</span> ' + name;
            winnersList.appendChild(badge);

            /* ปลดล็อก */
            isSpinning = false;
            drawBtn.disabled = false;
            nameInput.disabled = false;

            fireConfetti();
        }

        /* ============================
           Confetti — ระบบลูกกระสอบ
           ============================ */
        function fireConfetti() {
            const cvs = document.getElementById('confettiCanvas');
            const c   = cvs.getContext('2d');
            cvs.width  = window.innerWidth;
            cvs.height = window.innerHeight;
            cvs.style.width  = cvs.width + 'px';
            cvs.style.height = cvs.height + 'px';

            const palette = [
                '#ffd466','#f0a500','#ffffff','#ff6b6b',
                '#ff8e53','#ffd93d','#ffb347','#ff6f61',
                '#c9b037','#e8d5b7','#4ecdc4'
            ];

            const N   = 280;
            const cx  = cvs.width / 2;
            const cy  = cvs.height * 0.28;
            const pts = [];

            for (let i = 0; i < N; i++) {
                const a = (Math.random() - 0.5) * Math.PI * 0.85;
                const s = Math.random() * 15 + 4;
                pts.push({
                    x: cx + (Math.random() - 0.5) * 180,
                    y: cy,
                    vx: Math.sin(a) * s * (Math.random() > 0.5 ? 1 : -1),
                    vy: -Math.abs(Math.cos(a) * s) - Math.random() * 5,
                    col: palette[Math.floor(Math.random() * palette.length)],
                    w: Math.random() * 10 + 4,
                    h: Math.random() * 6 + 2,
                    rot: Math.random() * 6.28,
                    rs: (Math.random() - 0.5) * 0.28,
                    circ: Math.random() > 0.6,
                    g: 0.13 + Math.random() * 0.08,
                    d: 0.984 + Math.random() * 0.012,
                    wb: Math.random() * 6.28,
                    ws: 0.03 + Math.random() * 0.04
                });
            }

            function frame() {
                c.clearRect(0, 0, cvs.width, cvs.height);
                let alive = 0;
                for (const p of pts) {
                    p.vy += p.g;
                    p.vx *= p.d;
                    p.vy *= p.d;
                    p.vx += Math.sin(p.wb) * 0.28;
                    p.wb += p.ws;
                    p.x += p.vx;
                    p.y += p.vy;
                    p.rot += p.rs;

                    if (p.y < cvs.height + 60) {
                        alive++;
                        const fade = Math.min(1, Math.max(0, (cvs.height - p.y) / 160));
                        c.save();
                        c.globalAlpha = fade;
                        c.translate(p.x, p.y);
                        c.rotate(p.rot);
                        c.fillStyle = p.col;
                        if (p.circ) {
                            c.beginPath();
                            c.arc(0, 0, Math.max(1, p.w / 2), 0, 6.2832);
                            c.fill();
                        } else {
                            c.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
                        }
                        c.restore();
                    }
                }
                if (alive > 0) requestAnimationFrame(frame);
                else c.clearRect(0, 0, cvs.width, cvs.height);
            }
            frame();
        }

        /* รักษาขนาด canvas ตามหน้าต่าง */
        window.addEventListener('resize', () => {
            const cvs = document.getElementById('confettiCanvas');
            cvs.width  = window.innerWidth;
            cvs.height = window.innerHeight;
            cvs.style.width  = cvs.width + 'px';
            cvs.style.height = cvs.height + 'px';
        });
    </script>
</body>
